<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistemas Administrativos y Financieros</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #123b63;
      --navy-deep: #0a2f4f;
      --blue: #2f6c8d;
      --accent: #9c7a2e;
      --ink: #273442;
      --muted: #65717f;
      --line: #d9e0e7;
      --line-strong: #c6d0dc;
      --canvas: #f3f5f7;
      --surface: #fff;
      --strategic: #455b7a;
      --mission: #2f6c7c;
      --support: #5d745f;
      --risk-high: #b93832;
      --risk-medium-high: #d76f32;
      --risk-medium: #bd8c28;
      --risk-low: #438c55;
      --rail: clamp(126px, 15vw, 238px);
      font-family: Aptos, "Segoe UI", Tahoma, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-size: 13px;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }

    .app {
      display: grid;
      grid-template-columns: var(--rail) minmax(0, 1fr);
      grid-template-rows: 30px minmax(0, 1fr);
      width: 100%;
      height: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 0 7px;
      color: white;
      background: var(--navy-deep);
      border-right: 1px solid rgba(255,255,255,.18);
    }

    .seal {
      display: grid;
      place-items: center;
      flex: 0 0 17px;
      width: 17px;
      height: 20px;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 2px;
      font-family: Georgia, serif;
      font-size: 10px;
      line-height: 1;
    }

    .brand-copy { min-width: 0; line-height: 1.1; }
    .brand-copy strong { display: block; overflow: hidden; font-size: 10px; font-weight: 650; white-space: nowrap; text-overflow: ellipsis; }
    .brand-copy span { display: block; margin-top: 2px; color: #d0dce8; font-size: 10px; white-space: nowrap; }

    .topbar {
      display: flex;
      align-items: center;
      min-width: 0;
      padding: 0 8px;
      color: white;
      background: var(--navy);
      box-shadow: 0 1px 2px rgba(0,0,0,.18);
      z-index: 2;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      position: relative;
      flex: 0 0 23px;
      width: 23px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .icon-button:hover, .icon-button:focus-visible { background: rgba(255,255,255,.14); outline: none; }
    .icon-button svg { width: 13px; height: 13px; fill: currentColor; }
    .menu-toggle { margin-left: -5px; }
    .app-title { min-width: 0; margin-left: 3px; overflow: hidden; font-size: 14px; font-weight: 650; white-space: nowrap; text-overflow: ellipsis; }
    .app-subtitle { display: block; margin-top: 1px; color: #c2d3e3; font-size: 10px; font-weight: 400; }
    .top-spacer { flex: 1; }
    .top-actions { display: flex; align-items: center; gap: 1px; }
    .notification-count { position: absolute; top: 1px; right: 1px; min-width: 12px; height: 12px; padding: 0 2px; border-radius: 6px; background: #f1b722; color: var(--navy-deep); font-size: 9px; line-height: 12px; font-weight: 700; text-align: center; }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      margin-left: 4px;
      padding: 0 2px 0 4px;
      border: 0;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .avatar { display: grid; place-items: center; width: 19px; height: 19px; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; background: #b78362; color: white; font-size: 10px; font-weight: 700; }
    .user-name { max-width: 91px; overflow: hidden; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .chevron { width: 8px; height: 8px; fill: currentColor; }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #fff;
      border-right: 1px solid #d9dde2;
    }

    .search-wrap { padding: 8px 7px 5px; }
    .search-box { display: flex; align-items: center; height: 26px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--surface); }
    .search-box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(47,108,141,.14); }
    .search-box input { width: 100%; min-width: 0; padding: 0; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 11px; }
    .search-box input::placeholder { color: var(--muted); }
    .search-box svg { flex: 0 0 10px; width: 10px; height: 10px; fill: #939aa1; }

    .view-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 0 7px 8px; }
    .view-switch button { display: flex; align-items: center; justify-content: center; gap: 4px; height: 23px; padding: 0 4px; border: 1px solid transparent; border-radius: 3px; color: var(--muted); background: var(--surface); font-size: 10px; cursor: pointer; }
    .view-switch button.active { color: white; background: var(--navy); }
    .view-switch button:not(.active):hover { background: #f3f5f7; }
    .view-switch svg { width: 9px; height: 9px; fill: currentColor; }

    .systems-header { display: flex; align-items: center; justify-content: space-between; min-height: 30px; padding: 0 8px; border-top: 1px solid var(--line); color: var(--ink); }
    .systems-label { font-size: 11px; font-weight: 700; }
    .count { margin-left: 3px; padding: 2px 5px; border-radius: 7px; color: var(--navy); background: #e7f1f7; font-size: 10px; font-weight: 650; }
    .collapse-button { display: grid; place-items: center; width: 19px; height: 19px; border: 0; background: transparent; color: #3f7ca1; cursor: pointer; }
    .collapse-button svg { width: 10px; height: 10px; fill: currentColor; }

    .system-list { flex: 1; min-height: 0; margin: 0; padding: 0 3px 0 6px; overflow-y: auto; list-style: none; scrollbar-color: #c7cbd0 transparent; scrollbar-width: thin; }
    .system-list::-webkit-scrollbar { width: 7px; }
    .system-list::-webkit-scrollbar-thumb { border-radius: 7px; background: #c8ccd1; }
    .system-row { display: flex; align-items: center; min-height: 25px; gap: 5px; padding: 0 2px; border-radius: 3px; color: var(--ink); cursor: pointer; }
    .system-row:hover { background: #f3f6f8; }
    .system-row.selected { color: var(--navy); background: #edf3f7; }
    .status-dot { flex: 0 0 4px; width: 4px; height: 4px; border-radius: 50%; background: #a7b0b9; }
    .selected .status-dot { background: #27a8df; }
    .system-name { flex: 1; min-width: 0; overflow: hidden; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .favorite-button { display: grid; place-items: center; flex: 0 0 16px; width: 16px; height: 18px; padding: 0; border: 0; color: #98a1aa; background: transparent; cursor: pointer; }
    .favorite-button svg { width: 11px; height: 11px; fill: transparent; stroke: currentColor; stroke-width: 1.6; }
    .favorite-button.is-favorite { color: #d5a523; }
    .favorite-button.is-favorite svg { fill: currentColor; }
    .empty-state { padding: 12px 7px; color: var(--muted); font-size: 10px; text-align: center; }

    .sidebar-footer { flex: 0 0 auto; padding: 7px 7px 5px; border-top: 1px solid #eceef0; background: #fff; }
    .session-time { margin: 0 0 8px; color: #16191d; font-size: 12px; font-weight: 700; letter-spacing: .2px; text-align: center; }
    .session-time small { font-size: 10px; font-weight: 500; }
    .seat-select { width: 100%; height: 27px; padding: 0 7px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--surface); font-size: 10px; }
    .quick-links { display: flex; align-items: center; justify-content: space-around; padding: 9px 5px 0; }
    .quick-link { display: grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; color: white; background: #416b9e; cursor: pointer; }
    .quick-link:nth-child(2) { background: #07a8d5; }
    .quick-link:nth-child(3) { background: #9ba1a6; }
    .quick-link:nth-child(4) { background: #688d99; }
    .quick-link:hover { filter: brightness(1.08); }
    .quick-link svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    .main { min-width: 0; min-height: 0; overflow: auto; background: var(--canvas); }
    .workspace-label { margin: 7px 9px; color: var(--ink); font-size: 11px; }
    .workspace-label span { font-weight: 600; }
    .process-screen { max-width: 1560px; margin: 0 auto; padding: 18px 22px 28px; }
    .process-heading { display: flex; align-items: flex-start; justify-content: center; gap: 16px; margin-bottom: 14px; text-align: center; }
    .process-heading h1 { margin: 0; color: var(--navy); font-size: 24px; font-weight: 750; }
    .process-heading h1::after { display: block; width: 56px; height: 3px; margin: 8px auto 0; background: var(--accent); content: ""; }
    .process-heading p { max-width: 760px; margin: 6px auto 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .process-flow { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: stretch; gap: 8px; }
    .process-boundary { display: flex; align-items: center; justify-content: center; padding: 10px 7px; border: 1px solid #95a3b8; border-radius: 7px; border-top: 3px solid var(--accent); color: var(--navy); background: #f7f8fb; text-align: center; }
    .process-boundary-copy { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 12px; writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); }
    .process-boundary h2 { margin: 0; font-size: 13px; }
    .process-boundary p { margin: 0; font-size: 11px; font-weight: 600; line-height: 1.45; }
    .process-levels { display: grid; gap: 14px; min-width: 0; }
    .process-level { position: relative; padding: 0 10px 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: #f7f8fb; }
    .process-level > h2 { margin: 0 -10px 10px; padding: 9px 14px; border-radius: 5px 5px 0 0; color: #fff; background: var(--strategic); font-size: 13px; font-weight: 750; text-align: center; text-transform: uppercase; }
    .process-level > h2 a { display: block; margin: -9px -14px; padding: 9px 14px; border-radius: inherit; color: inherit; text-decoration: none; }
    .process-level > h2 a:hover, .process-level > h2 a:focus-visible { background: rgba(255,255,255,.12); outline: 2px solid #fff; outline-offset: -3px; }
    .process-level.strategic > h2 { background: var(--strategic); }
    .process-level.mission > h2 { background: var(--mission); }
    .process-level.support > h2 { background: var(--support); }
    .process-grid { display: grid; gap: 8px; min-width: 0; }
    .strategic-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .mission-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .support-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .process-group { min-width: 0; padding: 7px; border: 1px solid var(--line-strong); border-radius: 5px; background: #e9eef4; }
    .process-group h3 { min-height: 22px; margin: 0 0 6px; color: var(--navy); font-size: 11px; font-weight: 750; line-height: 1.25; text-align: center; text-transform: uppercase; }
    .process-links { display: grid; align-content: start; gap: 5px; }
    .process-link { display: grid; place-items: center; min-height: 42px; padding: 7px 8px; border: 1px solid var(--line-strong); border-radius: 5px; color: #34485d; background: #f7f9fb; font-size: 12px; font-weight: 550; line-height: 1.3; text-align: center; text-decoration: none; transition: background-color .15s ease, border-color .15s ease, transform .15s ease; }
    .process-link:hover, .process-link:focus-visible { transform: translateY(-1px); background: #eaf1f7; }
    .process-link.is-macro:hover, .process-link.is-macro:focus-visible { border-color: var(--blue); }
    .process-group-subtitle { margin: 5px 0 3px; color: var(--navy); font-size: 11px; font-weight: 750; text-align: center; text-transform: uppercase; }
    .process-status { min-height: 16px; margin: 10px 0 0; color: var(--muted); font-size: 11px; }
    .detail-back { display: inline-block; margin-bottom: 14px; color: var(--navy); font-size: 12px; text-decoration: none; }
    .detail-back:hover { color: #7b641e; text-decoration: underline; }
    .process-detail-heading { margin-bottom: 18px; text-align: center; }
    .process-detail-heading h1 { margin: 0; color: var(--navy); font-size: 21px; }
    .process-detail-heading p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .process-detail-content { max-width: 900px; margin: 0 auto; padding: 20px; border: 1px solid #b7c3d8; border-top: 3px solid #c4a13c; border-radius: 6px; background: #f7f8fb; }
    .process-detail-content h2 { margin: 0 0 8px; color: var(--navy); font-size: 15px; text-align: center; }
    .process-detail-content p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; }
    .macro-overview { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 12px; max-width: 900px; margin: 0 auto 16px; }
    .macro-description, .macro-count { min-width: 0; padding: 14px; border: 1px solid #b7c3d8; border-top: 3px solid #c4a13c; border-radius: 6px; background: #fff; }
    .macro-description h2 { margin: 0 0 7px; color: var(--navy); font-size: 15px; }
    .macro-description p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .macro-count { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .macro-count span { color: var(--muted); font-size: 12px; font-weight: 650; }
    .macro-count strong { margin: 3px 0; color: var(--navy); font-size: 25px; }
    .macro-count small { color: var(--muted); font-size: 11px; }
    .macro-dashboard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, .9fr); gap: 16px; max-width: 900px; margin: 0 auto 18px; }
    .risk-panel, .macro-process-list { min-width: 0; padding: 14px; border: 1px solid #b7c3d8; border-radius: 6px; background: #fff; }
    .risk-panel { border-top: 3px solid #c4a13c; }
    .risk-panel-heading { display: flex; justify-content: space-between; gap: 8px; color: var(--navy); font-size: 12px; font-weight: 700; }
    .risk-panel-heading span:last-child { color: var(--muted); font-size: 11px; font-weight: 400; }
    .risk-content { display: flex; align-items: center; justify-content: center; gap: 20px; min-height: 170px; }
    .risk-chart { display: grid; place-items: center; flex: 0 0 116px; width: 116px; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(var(--risk-gradient)); }
    .risk-chart::before { grid-area: 1 / 1; width: 68px; aspect-ratio: 1; border-radius: 50%; background: #fff; content: ""; }
    .risk-total { z-index: 1; grid-area: 1 / 1; color: var(--navy); font-size: 20px; font-weight: 750; text-align: center; }
    .risk-total small { display: block; color: var(--muted); font-size: 10px; font-weight: 400; }
    .risk-legend { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .risk-legend li { display: grid; grid-template-columns: 12px auto auto; align-items: center; gap: 6px; color: var(--ink); font-size: 11px; white-space: nowrap; }
    .risk-swatch { width: 11px; height: 11px; border-radius: 3px; background: var(--risk-color); }
    .risk-legend strong { color: var(--risk-color); font-size: 11px; }
    .risk-legend small { color: var(--muted); font-size: 10px; }
    .macro-process-list h2 { margin: 0 0 10px; color: var(--navy); font-size: 15px; }
    .macro-process-list ol { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; counter-reset: macro-process; }
    .macro-process-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; color: #34485d; background: #f7f9fb; font-size: 12px; line-height: 1.4; }
    .risk-badge { flex: 0 0 auto; padding: 3px 6px; border-radius: 3px; color: var(--risk-color); background: color-mix(in srgb, var(--risk-color) 12%, white); font-size: 10px; font-weight: 700; }
    .demo-note { margin: 0; color: var(--muted); font-size: 10px; text-align: right; }
    .sidebar.is-collapsed .search-wrap,
    .sidebar.is-collapsed .view-switch,
    .sidebar.is-collapsed .systems-header,
    .sidebar.is-collapsed .system-list,
    .sidebar.is-collapsed .sidebar-footer { display: none; }
    .app.sidebar-collapsed { --rail: 36px; }
    .app.sidebar-collapsed .brand { justify-content: center; padding: 0; }
    .app.sidebar-collapsed .brand-copy { display: none; }

    @media (max-width: 780px) {
      .process-flow { grid-template-columns: 1fr; }
      .macro-dashboard { grid-template-columns: 1fr; }
      .macro-overview { grid-template-columns: 1fr; }
      .process-boundary-copy { flex-direction: column; writing-mode: horizontal-tb; transform: none; }
    }

    @media (max-width: 560px) {
      :root { --rail: 126px; }
      .app-title { font-size: 12px; }
      .user-name { display: none; }
      .topbar { padding-right: 4px; }
      .app.sidebar-collapsed { --rail: 36px; }
      .process-screen { padding: 14px 12px 20px; }
      .process-heading { flex-direction: column; gap: 10px; }
      .process-heading h1 { font-size: 20px; }
      .process-boundary { padding: 10px; }
      .mission-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .support-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .risk-content { flex-direction: column; gap: 14px; }
      .risk-chart { align-self: center; }
      .risk-legend { width: 100%; }
    }
    @media (max-width: 780px) and (min-width: 561px) {
      .process-flow { grid-template-columns: minmax(0, 1fr); }
      .process-boundary { padding: 10px; }
      .support-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    body.locked .app { display: none; }

    .login-gate {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--navy-deep), var(--navy));
      z-index: 1000;
    }

    body:not(.locked) .login-gate { display: none; }

    .login-card {
      width: min(340px, 90vw);
      background: var(--surface);
      border-radius: 10px;
      padding: 28px 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .login-card .seal {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .login-card h1 {
      font-size: 16px;
      margin: 0 0 4px;
      color: var(--navy-deep);
    }

    .login-card p.subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }

    .login-field label { font-size: 12px; color: var(--muted); }

    .login-field input {
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .login-field input:focus {
      outline: 2px solid var(--blue);
      outline-offset: 1px;
    }

    .login-submit {
      width: 100%;
      border: none;
      border-radius: 6px;
      background: var(--navy);
      color: #fff;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-submit:hover { background: var(--navy-deep); }

    .login-error {
      min-height: 16px;
      color: var(--risk-high);
      font-size: 12px;
      margin: 8px 0 0;
    }
  </style>
</head>
<body class="locked">
  <div class="login-gate" id="loginGate" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="seal" aria-hidden="true">UC</div>
      <h1 id="loginTitle">Acceso restringido</h1>
      <p class="subtitle">Ingresa tus credenciales para continuar.</p>
      <div class="login-field">
        <label for="loginUser">Usuario</label>
        <input id="loginUser" name="username" type="text" required autocomplete="username">
      </div>
      <div class="login-field">
        <label for="loginPass">Contraseña</label>
        <input id="loginPass" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="login-submit" type="submit">Ingresar</button>
      <p class="login-error" id="loginError" role="alert"></p>
    </form>
  </div>

  <div class="app" id="app">
    <div class="brand" aria-label="Universidad Chinchorro">
      <div class="seal" aria-hidden="true">UC</div>
      <div class="brand-copy">
        <strong>Universidad Chinchorro</strong>
        <span>Santiago · U. Chinchorro</span>
      </div>
    </div>

    <header class="topbar">
      <button class="icon-button menu-toggle" id="menuToggle" type="button" aria-label="Contraer menú" title="Contraer menú">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v1.5H2zm0 4.25h12v1.5H2zM2 11.5h12V13H2z"/></svg>
      </button>
      <div class="app-title">Sistemas Administrativos Y Financieros<span class="app-subtitle">Dashboard</span></div>
      <div class="top-spacer"></div>
      <nav class="top-actions" aria-label="Accesos rápidos">
        <button class="icon-button" type="button" title="Inicio" aria-label="Inicio"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m1.3 7.1 6.2-5.4a.8.8 0 0 1 1 0l6.2 5.4-.9 1-1.1-.9v6.2H9.2V9.7H6.8v3.7H3.3V7.2l-1.1.9z"/></svg></button>
        <button class="icon-button" type="button" title="Aplicaciones" aria-label="Aplicaciones"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1m2 2.1a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2M2.4 11h5.2c-.2-1.3-1.1-2-2.6-2s-2.4.7-2.6 2M9 5h3.5v1H9zm0 2h3.5v1H9z"/></svg></button>
        <button class="icon-button" type="button" title="Notificaciones" aria-label="Notificaciones (1 nueva)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a1.5 1.5 0 0 0-1.5 1.4 5 5 0 0 0-3 4.6v2.2L2 11.5v1h12v-1l-1.5-1.8V7.5a5 5 0 0 0-3-4.6A1.5 1.5 0 0 0 8 1.5M6.2 13.4a1.8 1.8 0 0 0 3.6 0z"/></svg><span class="notification-count">1</span></button>
        <button class="user-menu" type="button" aria-label="Cuenta de Admin">
          <span class="avatar">A</span><span class="user-name">Admin</span>
          <svg class="chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="m1.5 3 3.5 3.5L8.5 3z"/></svg>
        </button>
      </nav>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Menú de sistemas">
      <div class="search-wrap">
        <label class="search-box">
          <input id="systemSearch" type="search" placeholder="Buscar sistema o perfil..." aria-label="Buscar sistema o perfil">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.8 1.5a5.3 5.3 0 1 0 3.3 9.5l3.1 3.1 1-1-3.1-3.1a5.3 5.3 0 0 0-4.3-8.5m0 1.5a3.8 3.8 0 1 1 0 7.6 3.8 3.8 0 0 1 0-7.6"/></svg>
        </label>
      </div>
      <div class="view-switch" role="tablist" aria-label="Filtrar sistemas">
        <button class="active" type="button" data-view="all" role="tab" aria-selected="true">Todo</button>
        <button type="button" data-view="favorites" role="tab" aria-selected="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 1 2 4.1 4.5.7-3.3 3.2.8 4.6L8 11.4l-4 2.2.8-4.6L1.5 5.8 6 5.1z"/></svg>Favoritos</button>
      </div>
      <div class="systems-header">
        <div><span class="systems-label">Sistema</span><span class="count" id="systemCount">5</span></div>
        <button class="collapse-button" id="collapseList" type="button" aria-label="Ocultar lista de sistemas" title="Ocultar lista"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 7h12v2H2z"/></svg></button>
      </div>
      <ul class="system-list" id="systemList"></ul>
      <footer class="sidebar-footer">
        <p class="session-time" id="sessionTime">56 M : 15 S</p>
        <select class="seat-select" aria-label="Cambiar sede">
          <option value="">Cambiar Sede...</option>
          <option>Casa Matriz Santiago</option>
          <option>Sede Arica</option>
          <option>Sede Antofagasta</option>
        </select>
        <div class="quick-links" aria-label="Módulos frecuentes">
          <button class="quick-link" type="button" title="Institución" aria-label="Institución"><svg viewBox="0 0 16 16"><path d="M2 13.5h12M3.5 12V6h9v6M2.5 5.5 8 2l5.5 3.5zM6 7.5v4M10 7.5v4"/></svg></button>
          <button class="quick-link" type="button" title="Transporte" aria-label="Transporte"><svg viewBox="0 0 16 16"><path d="M3 11.5V4a1.5 1.5 0 0 1 1.5-1.5h7A1.5 1.5 0 0 1 13 4v7.5M3 8h10M4.5 11.5v2m7-2v2M3 5.5h10M5.3 10h.1m5.2 0h.1"/></svg></button>
          <button class="quick-link" type="button" title="Indicadores" aria-label="Indicadores"><svg viewBox="0 0 16 16"><path d="M2 13.5h12M3 11V8m3 3V5m3 6V7m3 4V3"/></svg></button>
          <button class="quick-link" type="button" title="Soporte" aria-label="Soporte"><svg viewBox="0 0 16 16"><path d="M2 8a6 6 0 0 1 12 0v3a1.5 1.5 0 0 1-1.5 1.5H11V8h3M2 8v3a1.5 1.5 0 0 0 1.5 1.5H5V8H2m4 5h4"/></svg></button>
        </div>
      </footer>
    </aside>

    <main class="main" id="workspace" aria-label="Área de trabajo">
      <p class="workspace-label">Inicio area: <span>[2]</span></p>
    </main>
  </div>

  <script defer src="app.js"></script>
  <script type="text/plain" data-legacy="migrated-to-app-js">
    // SHA-256 of "usuario:contraseña" — evita texto plano en el código fuente (no es seguridad real en un sitio estático público)
    const AUTH_HASH = "bf6b5bdb74c79ece9fc0ad0ac9fb0359f9555d4f35a83b2e6ec69ae99e09603d";
    const AUTH_SESSION_KEY = "procesos-auth-ok";

    async function sha256Hex(text) {
      const data = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function unlockApp() {
      document.body.classList.remove("locked");
      document.querySelector("#loginUser").value = "";
      document.querySelector("#loginPass").value = "";
    }

    if (sessionStorage.getItem(AUTH_SESSION_KEY) === "1") {
      unlockApp();
    }

    document.querySelector("#loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorEl = document.querySelector("#loginError");
      const user = document.querySelector("#loginUser").value.trim();
      const pass = document.querySelector("#loginPass").value;
      const hash = await sha256Hex(`${user}:${pass}`);
      if (hash === AUTH_HASH) {
        sessionStorage.setItem(AUTH_SESSION_KEY, "1");
        errorEl.textContent = "";
        unlockApp();
      } else {
        errorEl.textContent = "Usuario o contraseña incorrectos.";
        document.querySelector("#loginPass").value = "";
      }
    });

    let systems;
    let favoriteNames;
    let riskLevels;
    let processGroups;
    let strategicMacroDetails;
    let macroCategoryDescriptions;
    let macroCategoryDetails;
    const processCatalog = new Map();
    const list = document.querySelector("#systemList");
    const search = document.querySelector("#systemSearch");
    const count = document.querySelector("#systemCount");
    const workspace = document.querySelector("#workspace");
    const viewButtons = [...document.querySelectorAll("[data-view]")];
    let activeView = "all";
    let selectedSystem = "Mapa de Procesos Universidad Chinchorro";

    // Reconstruye la forma anidada (categoría > grupo > subgrupo) que usan las funciones de render a partir de las tablas normalizadas del JSON
    function buildProcessGroups(data) {
      return data.categories.map((category) => {
        if (category.id === "strategic") {
          const items = data.macroprocesses.filter((m) => m.categoryId === category.id).map((m) => m.label);
          return { id: category.id, title: category.title, className: category.className, items };
        }
        const groups = data.groups.filter((g) => g.categoryId === category.id).map((group) => {
          const items = data.processes.filter((p) => p.groupId === group.id).map((p) => p.label);
          const subgroups = data.subgroups.filter((sg) => sg.groupId === group.id).map((sg) => ({
            title: sg.title,
            items: data.processes.filter((p) => p.subgroupId === sg.id).map((p) => p.label)
          }));
          return subgroups.length ? { title: group.title, items, subgroups } : { title: group.title, items };
        });
        return { id: category.id, title: category.title, className: category.className, groups };
      });
    }

    function buildStrategicMacroDetails(data) {
      const entries = data.macroprocesses
        .filter((m) => m.categoryId === "strategic")
        .map((m) => [m.id, {
          description: m.description,
          processes: data.processes.filter((p) => p.macroprocessId === m.id).map((p) => ({ name: p.label, risk: p.risk }))
        }]);
      return new Map(entries);
    }

    async function loadData() {
      const response = await fetch("data.json");
      if (!response.ok) throw new Error(`No se pudo cargar data.json (${response.status})`);
      return response.json();
    }

    function processSlug(label) {
      return label.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function addProcessToCatalog(label, category) {
      const key = processSlug(label);
      processCatalog.set(key, { label, category });
    }

    function renderProcessLink(label) {
      const key = processSlug(label);
      const isMacro = strategicMacroDetails.has(key);
      const route = isMacro ? "macro" : "proceso";
      return `<a class="process-link${isMacro ? " is-macro" : ""}" href="#${route}-${key}" data-process-key="${key}" title="Ver detalle de ${label}">${label}</a>`;
    }

    function renderProcessGroup(group) {
      const subgroups = (group.subgroups || []).map((subgroup) => `
        <p class="process-group-subtitle">${subgroup.title}</p>
        <div class="process-links">${subgroup.items.map(renderProcessLink).join("")}</div>`).join("");
      return `<section class="process-group"><h3>${group.title}</h3><div class="process-links">${group.items.map(renderProcessLink).join("")}</div>${subgroups}</section>`;
    }


    function renderStrategicMacro(macro, key, label = processCatalog.get(key)?.label || "Proceso estratégico", subtitle = "Macroproceso estratégico") {
      const counts = new Map(riskLevels.map((level) => [level.label, 0]));
      for (const process of macro.processes) counts.set(process.risk, (counts.get(process.risk) || 0) + 1);
      const total = macro.processes.length;
      let cumulative = 0;
      const gradient = riskLevels.map((level) => {
        const start = cumulative / total * 100;
        cumulative += counts.get(level.label);
        return `${level.color} ${start}% ${cumulative / total * 100}%`;
      }).join(", ");
      const legend = riskLevels.map((level) => {
        const amount = counts.get(level.label);
        const percentage = Math.round(amount / total * 100);
        return `<li><span class="risk-swatch" style="--risk-color:${level.color}" aria-hidden="true"></span><strong style="--risk-color:${level.color}">${level.label}</strong><span>${amount} proceso${amount === 1 ? "" : "s"} <small>(${percentage}%)</small></span></li>`;
      }).join("");
      const processes = macro.processes.map((process) => {
        const level = riskLevels.find((item) => item.label === process.risk);
        return `<li>${process.name}<span class="risk-badge" style="--risk-color:${level.color}">${level.label}</span></li>`;
      }).join("");
      workspace.innerHTML = `
        <section class="process-screen" aria-labelledby="processDetailTitle">
          <a class="detail-back" href="#mapa">Volver al mapa</a>
          <header class="process-detail-heading">
            <h1 id="processDetailTitle">${label}</h1>
            <p>${subtitle}</p>
          </header>
          <div class="macro-overview">
            <section class="macro-description" aria-labelledby="macroDescriptionTitle">
              <h2 id="macroDescriptionTitle">Descripción del macroproceso</h2>
              <p>${macro.description}</p>
            </section>
            <section class="macro-count" aria-label="Cantidad de procesos existentes">
              <span>Procesos existentes</span><strong>${total}</strong><small>en este macroproceso</small>
            </section>
          </div>
          <div class="macro-dashboard">
            <section class="risk-panel" aria-label="Dashboard de nivel de riesgo">
              <div class="risk-panel-heading"><span>Procesos por nivel de riesgo</span><span>Total: ${total} procesos</span></div>
              <div class="risk-content">
                <div class="risk-chart" style="--risk-gradient:${gradient}" role="img" aria-label="Distribución de riesgo en ${total} procesos">
                  <div class="risk-total">${total}<small>procesos</small></div>
                </div>
                <ul class="risk-legend">${legend}</ul>
              </div>
            </section>
            <section class="macro-process-list" aria-labelledby="macroProcessListTitle">
              <h2 id="macroProcessListTitle">Procesos incluidos (${total})</h2>
              <ol>${processes}</ol>
            </section>
          </div>
          <p class="demo-note">Datos de ejemplo; distribución calculada desde los procesos listados.</p>
        </section>`;
    }

    function renderWorkspace() {
      if (!processGroups) return;
      const categoryKey = window.location.hash.match(/^#categoria-(.+)$/)?.[1];
      const category = macroCategoryDetails.get(categoryKey);
      if (category) {
        renderStrategicMacro(category, categoryKey, category.label, "Macroproceso");
        return;
      }

      const macroKey = window.location.hash.match(/^#macro-(.+)$/)?.[1];
      const macro = strategicMacroDetails.get(macroKey);
      if (macro) {
        renderStrategicMacro(macro, macroKey);
        return;
      }

      const processKey = window.location.hash.match(/^#proceso-(.+)$/)?.[1];
      const process = processCatalog.get(processKey);
      if (process) {
        workspace.innerHTML = `
          <section class="process-screen" aria-labelledby="processDetailTitle">
            <a class="detail-back" href="#mapa">Volver al mapa</a>
            <header class="process-detail-heading">
              <h1 id="processDetailTitle">${process.label}</h1>
              <p>${process.category}</p>
            </header>
            <section class="process-detail-content" aria-labelledby="detailSectionTitle">
              <h2 id="detailSectionTitle">Detalle del proceso</h2>
              <p>La información detallada de este proceso estará disponible aquí.</p>
            </section>
          </section>`;
        return;
      }

      if (selectedSystem !== "Mapa de Procesos Universidad Chinchorro") {
        workspace.innerHTML = '<p class="workspace-label">Inicio area: <span>[2]</span></p>';
        return;
      }

      const levels = processGroups.map((level) => `
        <section class="process-level ${level.className}" aria-labelledby="level-${level.id}">
          <h2 id="level-${level.id}"><a href="#categoria-${level.id}" title="Ver detalle de ${level.title}">${level.title}</a></h2>
          <div class="process-grid ${level.id}-grid">${level.items ? level.items.map(renderProcessLink).join("") : level.groups.map(renderProcessGroup).join("")}</div>
        </section>`).join("");

      workspace.innerHTML = `
        <section class="process-screen" aria-labelledby="processTitle">
          <div class="process-heading">
            <div>
              <h1 id="processTitle">Mapa de Procesos</h1>
              <p>Procesos estratégicos, misionales y de apoyo de la Universidad Chinchorro.</p>
            </div>
          </div>
          <div class="process-flow">
            <aside class="process-boundary"><div class="process-boundary-copy"><h2>Entradas</h2><p>Necesidades de desarrollo científico, tecnológico y humanístico del territorio y la institución.</p></div></aside>
            <div class="process-levels">${levels}</div>
            <aside class="process-boundary"><div class="process-boundary-copy"><h2>Resultados</h2><p>Profesionales formados, publicaciones, asesorías, cursos y servicios para la comunidad.</p></div></aside>
          </div>
          <p class="process-status" id="processStatus" role="status" aria-live="polite"></p>
        </section>`;
    }

    function renderSystems() {
      if (!systems) return;
      const query = search.value.trim().toLocaleLowerCase("es");
      const visible = systems.filter((name) => {
        const matchesSearch = name.toLocaleLowerCase("es").includes(query);
        return matchesSearch && (activeView === "all" || favoriteNames.has(name));
      });
      visible.sort((first, second) => {
        if (first === "Mapa de Procesos Universidad Chinchorro") return -1;
        if (second === "Mapa de Procesos Universidad Chinchorro") return 1;
        return Number(favoriteNames.has(second)) - Number(favoriteNames.has(first));
      });

      count.textContent = activeView === "all" ? systems.length : favoriteNames.size;
      list.replaceChildren();
      if (visible.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.textContent = "No se encontraron sistemas";
        list.append(empty);
        return;
      }

      for (const name of visible) {
        const row = document.createElement("li");
        row.className = `system-row${selectedSystem === name ? " selected" : ""}`;
        row.setAttribute("role", "option");
        row.setAttribute("aria-selected", String(selectedSystem === name));
        row.tabIndex = 0;

        const dot = document.createElement("span");
        dot.className = "status-dot";
        dot.setAttribute("aria-hidden", "true");

        const label = document.createElement("span");
        label.className = "system-name";
        label.textContent = name;
        label.title = name;

        const favorite = document.createElement("button");
        favorite.className = `favorite-button${favoriteNames.has(name) ? " is-favorite" : ""}`;
        favorite.type = "button";
        favorite.setAttribute("aria-label", `${favoriteNames.has(name) ? "Quitar de" : "Agregar a"} favoritos: ${name}`);
        favorite.title = favoriteNames.has(name) ? "Quitar de favoritos" : "Agregar a favoritos";
        favorite.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 1.4 2 4.1 4.5.7-3.2 3.2.7 4.6L8 11.8l-4 2.2.7-4.6-3.2-3.2L6 5.5z"/></svg>';
        favorite.addEventListener("click", (event) => {
          event.stopPropagation();
          favoriteNames.has(name) ? favoriteNames.delete(name) : favoriteNames.add(name);
          renderSystems();
        });
        row.addEventListener("click", () => {
          if (window.location.hash.startsWith("#proceso-") || window.location.hash.startsWith("#macro-")) window.location.hash = "#mapa";
          selectedSystem = name;
          renderSystems();
          renderWorkspace();
        });
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            if (window.location.hash.startsWith("#proceso-") || window.location.hash.startsWith("#macro-")) window.location.hash = "#mapa";
            selectedSystem = name;
            renderSystems();
            renderWorkspace();
          }
        });
        row.append(dot, label, favorite);
        list.append(row);
      }
    }

    search.addEventListener("input", renderSystems);
    window.addEventListener("hashchange", renderWorkspace);
    viewButtons.forEach((button) => button.addEventListener("click", () => {
      activeView = button.dataset.view;
      viewButtons.forEach((tab) => {
        const selected = tab === button;
        tab.classList.toggle("active", selected);
        tab.setAttribute("aria-selected", String(selected));
      });
      renderSystems();
    }));

    const app = document.querySelector("#app");
    const sidebar = document.querySelector("#sidebar");
    const menuToggle = document.querySelector("#menuToggle");
    menuToggle.addEventListener("click", () => {
      const collapsed = app.classList.toggle("sidebar-collapsed");
      sidebar.classList.toggle("is-collapsed", collapsed);
      menuToggle.setAttribute("aria-label", collapsed ? "Expandir menú" : "Contraer menú");
      menuToggle.title = collapsed ? "Expandir menú" : "Contraer menú";
    });
    document.querySelector("#collapseList").addEventListener("click", () => {
      const collapsed = sidebar.classList.toggle("is-collapsed");
      document.querySelector("#collapseList").setAttribute("aria-label", collapsed ? "Mostrar lista de sistemas" : "Ocultar lista de sistemas");
    });

    let remainingSeconds = 56 * 60 + 15;
    window.setInterval(() => {
      if (remainingSeconds > 0) remainingSeconds -= 1;
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      document.querySelector("#sessionTime").innerHTML = `${minutes} M : ${String(seconds).padStart(2, "0")} S`;
    }, 1000);

    async function initApp() {
      let data;
      try {
        data = await loadData();
      } catch (err) {
        console.error(err);
        workspace.innerHTML = '<p class="workspace-label">No se pudo cargar data.json. Si abriste el archivo directamente (file://), sirve la carpeta con un servidor local (ej. Live Server) e inténtalo de nuevo.</p>';
        return;
      }

      systems = data.systems.map((s) => s.name);
      favoriteNames = new Set(data.systems.filter((s) => s.favorite).map((s) => s.name));
      riskLevels = data.riskLevels.map((r) => ({ label: r.label, color: `var(${r.colorVar})` }));
      processGroups = buildProcessGroups(data);
      strategicMacroDetails = buildStrategicMacroDetails(data);
      macroCategoryDescriptions = Object.fromEntries(data.categories.map((c) => [c.id, c.description]));

      for (const level of processGroups) {
        for (const label of level.items || []) addProcessToCatalog(label, level.title);
        for (const group of level.groups || []) {
          for (const label of group.items) addProcessToCatalog(label, `${level.title} · ${group.title}`);
          for (const subgroup of group.subgroups || []) {
            for (const label of subgroup.items) addProcessToCatalog(label, `${level.title} · ${subgroup.title}`);
          }
        }
      }

      macroCategoryDetails = new Map(processGroups.map((level) => {
        const entries = level.id === "strategic"
          ? [...strategicMacroDetails.values()].flatMap((macro) => macro.processes)
          : level.groups.flatMap((group) => [
            ...group.items.map((name) => ({ name })),
            ...(group.subgroups || []).flatMap((subgroup) => subgroup.items.map((name) => ({ name })))
          ]);
        const offset = level.id === "mission" ? 1 : 2;
        const processes = entries.map((process, index) => ({
          ...process,
          risk: process.risk || riskLevels[(index + offset) % riskLevels.length].label
        }));
        return [level.id, { label: level.title, description: macroCategoryDescriptions[level.id], processes }];
      }));

      renderSystems();
      renderWorkspace();
    }

    initApp();
  </script>
</body>
